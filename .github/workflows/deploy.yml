name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# reusable build（构建一次，artifact 供 deploy / 重试复用）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate section index pages
        # 从 frontmatter 生成 concepts/entities/comparisons 的列表页
        run: python scripts/gen_index_pages.py docs

      - name: Build site
        # 不用 --strict：悬空 wikilinks（指向尚未创建的笔记）是知识库常态，
        # 不应阻断部署；坏链会用 extra.css 红字标记，便于排查
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub Pages 的 deploy-pages 偶发瞬时失败（"Deployment failed, try again later"）。
  # 重试几乎总能成功。这里串行重试 2 次，避免失败邮件。
  # 注意：deploy-pages 只能用同一次 workflow run 内上传的 artifact，
  # 所以重试 job 要重新 build + upload + deploy（artifact run 间不共享）。
  retry-1:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/gen_index_pages.py docs
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  retry-2:
    needs: retry-1
    if: failure()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/gen_index_pages.py docs
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
